name: Education Digest

on:
  schedule:
    # Lunes, miércoles y viernes a las 8am hora de Nueva York (UTC-4 en verano = 12:00 UTC)
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch: # permite correrlo manualmente desde GitHub

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser anthropic requests python-dotenv

      - name: Run Education Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python education_agent.py
